<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1E2A4A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>深夜拉面屋</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
<style>
:root{
  --night:#1E2A4A;--night2:#2E3E6B;--noren:#33468A;
  --wood:#A86B3C;--wood2:#7A4A28;--amber:#FFB547;--amber2:#C9821E;
  --paper:#FFF4DC;--ink:#2A1F17;--matcha:#7CC26B;--chili:#E5484D;
  --display:'ZCOOL KuaiLe','PingFang SC','Hiragino Sans GB','Noto Sans SC',sans-serif;
  --body:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Noto Sans SC','Microsoft YaHei',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#131A30;color:var(--paper);font-family:var(--body);overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;touch-action:manipulation;-webkit-touch-callout:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
#app{position:relative;height:100%;height:100dvh;max-width:480px;margin:0 auto;overflow:hidden;background:var(--night)}
.screen{position:absolute;inset:0;display:none;flex-direction:column;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
.screen.on{display:flex}
.num{font-variant-numeric:tabular-nums}

/* ---------- buttons ---------- */
.btn{display:block;width:100%;background:var(--amber);color:var(--ink);font-family:var(--display);font-size:22px;padding:14px 10px 12px;border-radius:16px;box-shadow:0 5px 0 var(--amber2);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--amber2)}
.btn small{display:block;font-family:var(--body);font-size:12px;opacity:.7;margin-top:2px}
.btn.quiet{background:transparent;color:var(--paper);box-shadow:none;border:1.5px solid rgba(255,244,220,.35);font-size:17px}
.btn.quiet:active{transform:none;background:rgba(255,255,255,.06)}
.btn + .btn{margin-top:12px}

/* ---------- title ---------- */
#title{align-items:center;justify-content:space-between;background:
  radial-gradient(ellipse at 50% 38%,rgba(255,181,71,.22),transparent 60%),
  linear-gradient(#121a36,#2E3E6B 70%,#3A271B 70.2%,#2b1d14)}
.t-sky{position:absolute;inset:0 0 30% 0;background-image:radial-gradient(1px 1px at 12% 18%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 78% 10%,#fff 50%,transparent 51%),radial-gradient(1.5px 1.5px at 60% 28%,#ffe 50%,transparent 51%),radial-gradient(1px 1px at 30% 8%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 90% 34%,#fff 50%,transparent 51%);opacity:.7;pointer-events:none}
.t-top{margin-top:9vh;display:flex;flex-direction:column;align-items:center;position:relative}
.t-noren{display:flex;gap:5px}
.t-noren span{width:64px;height:118px;background:var(--noren);font-family:var(--display);font-size:46px;display:flex;justify-content:center;padding-top:16px;border-radius:0 0 6px 6px;transform-origin:top center;animation:sway 4.2s ease-in-out infinite;box-shadow:inset 0 -14px 0 rgba(0,0,0,.18)}
.t-noren span:nth-child(2){animation-delay:-.8s}.t-noren span:nth-child(3){animation-delay:-1.6s}.t-noren span:nth-child(4){animation-delay:-2.4s}
.t-bar{width:300px;height:12px;background:var(--wood2);border-radius:6px;margin-bottom:-2px;position:relative;z-index:1}
.t-bowl{font-size:76px;margin-top:5vh;position:relative;filter:drop-shadow(0 8px 12px rgba(0,0,0,.45))}
.t-bowl::before,.t-bowl::after{content:"";position:absolute;left:38%;top:-26px;width:8px;height:30px;border-radius:8px;background:rgba(255,255,255,.35);filter:blur(3px);animation:steam 2.4s ease-out infinite}
.t-bowl::after{left:56%;animation-delay:1.1s}
.t-tag{margin-top:18px;font-size:14px;opacity:.75;text-align:center;line-height:1.6;padding:0 30px}
.t-actions{width:100%;padding:0 28px 6vh}
.t-lan{position:absolute;top:10px;width:32px;height:44px}
.t-lan.l{left:-38px}.t-lan.r{right:-38px}

/* ---------- lanterns ---------- */
.lantern{border-radius:46%;background:radial-gradient(circle at 50% 40%,#FFE0A0,#F07A3A 55%,#C8382E 80%);box-shadow:0 0 26px rgba(255,140,60,.75);animation:swing 3.2s ease-in-out infinite;transform-origin:50% -10px}
.lantern::before{content:"";position:absolute;left:50%;top:-10px;width:2px;height:10px;background:#222;transform:translateX(-50%)}
.lantern::after{content:"";position:absolute;left:22%;right:22%;top:-2px;height:5px;background:#2a1a12;border-radius:2px}
@keyframes swing{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@keyframes sway{0%,100%{transform:skewX(0) rotate(0)}50%{transform:skewX(-3deg) rotate(1.2deg)}}
@keyframes steam{0%{transform:translateY(10px) scaleY(.6);opacity:0}30%{opacity:.8}100%{transform:translateY(-26px) scaleY(1.3);opacity:0}}

/* ---------- play: HUD ---------- */
.hud{display:flex;align-items:center;gap:10px;padding:8px 12px;background:#141B33;flex:none;font-size:14px;position:relative;z-index:3}
.hud .day{font-family:var(--display);font-size:18px;color:var(--amber);white-space:nowrap}
.clock{flex:1;display:flex;align-items:center;gap:7px;min-width:0}
.clock b{font-family:var(--display);font-weight:400;font-size:17px;min-width:44px}
.clock .bar{flex:1;height:6px;border-radius:3px;background:rgba(255,255,255,.14);overflow:hidden}
.clock .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#FFD27A,var(--amber),var(--chili))}
.hud .money{font-family:var(--display);font-size:19px;white-space:nowrap}
.hud .rep{color:var(--amber);font-size:13px;white-space:nowrap}

/* ---------- play: street ---------- */
.street{position:relative;height:112px;flex:none;overflow:hidden;background:linear-gradient(#131b38,#2E3E6B 92%)}
.street .sky{position:absolute;inset:0;background-image:radial-gradient(1px 1px at 8% 20%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 22% 9%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 40% 24%,#ffe 50%,transparent 51%),radial-gradient(1px 1px at 66% 12%,#fff 50%,transparent 51%),radial-gradient(1.4px 1.4px at 92% 26%,#fff 50%,transparent 51%);opacity:.6}
.moon{position:absolute;right:20px;top:9px;width:24px;height:24px;border-radius:50%;background:#FFF1C9;box-shadow:0 0 22px #FFE6A0}
.roof{position:absolute;left:0;right:0;top:34px;height:16px;background:repeating-linear-gradient(90deg,#4a2d1b 0 16px,#5e3b25 16px 18px);box-shadow:0 4px 8px rgba(0,0,0,.4)}
.roof::after{content:"";position:absolute;left:0;right:0;bottom:-6px;height:6px;background:#2e1c11}
.noren{position:absolute;left:50%;top:50px;transform:translateX(-50%);display:flex;gap:3px;z-index:1}
.noren span{width:42px;height:62px;background:var(--noren);font-family:var(--display);font-size:27px;display:flex;justify-content:center;padding-top:8px;border-radius:0 0 4px 4px;transform-origin:top center;animation:sway 4s ease-in-out infinite;box-shadow:inset 0 -8px 0 rgba(0,0,0,.18)}
.noren span:nth-child(2){animation-delay:-.7s}.noren span:nth-child(3){animation-delay:-1.4s}.noren span:nth-child(4){animation-delay:-2.1s}
.street .lantern{position:absolute;top:58px;width:28px;height:38px}
.street .lantern.a{left:16px}.street .lantern.b{right:16px}
.street .lantern.c{left:56px;top:62px;width:22px;height:30px;display:none}.street .lantern.d{right:56px;top:62px;width:22px;height:30px;display:none}
.street.d-lantern .lantern.c,.street.d-lantern .lantern.d{display:block}
.neon{position:absolute;left:12px;top:8px;font-family:var(--display);font-size:16px;color:#ffd6f0;text-shadow:0 0 6px #ff4fb4,0 0 14px #ff4fb4;display:none;animation:flicker 5s infinite}
.street.d-neon .neon{display:block}
@keyframes flicker{0%,92%,96%,100%{opacity:1}94%{opacity:.35}}
.roofcat{position:absolute;right:58px;top:14px;font-size:20px;display:none}
.street.d-cat .roofcat{display:block}
.evbadge{position:absolute;left:10px;bottom:6px;font-size:12px;background:rgba(0,0,0,.35);padding:3px 8px;border-radius:10px;z-index:2}
.street.d-neon .evbadge{bottom:6px}
.wx{position:absolute;inset:0;pointer-events:none;z-index:2}
.wx-rain .wx{background-image:repeating-linear-gradient(105deg,transparent 0 9px,rgba(190,210,255,.28) 9px 10px);background-size:40px 40px;animation:rain .45s linear infinite}
@keyframes rain{to{background-position:-10px 40px}}
.wx-cold .wx{background-image:radial-gradient(2px 2px at 10% 20%,#fff 50%,transparent 51%),radial-gradient(2px 2px at 40% 60%,#fff 50%,transparent 51%),radial-gradient(1.5px 1.5px at 70% 30%,#fff 50%,transparent 51%),radial-gradient(2px 2px at 85% 75%,#fff 50%,transparent 51%),radial-gradient(1.5px 1.5px at 25% 85%,#fff 50%,transparent 51%);background-size:120px 112px;animation:snow 4s linear infinite}
@keyframes snow{to{background-position:20px 112px}}
.wx-fest .wx::before,.wx-fest .wx::after{content:"";position:absolute;width:4px;height:4px;border-radius:50%;top:20px;left:28%;box-shadow:0 -14px #ffd36b,10px -10px #ff6b9a,14px 0 #8fd3ff,10px 10px #ffd36b,0 14px #ff6b9a,-10px 10px #8fd3ff,-14px 0 #ffd36b,-10px -10px #ff6b9a;animation:pop 1.8s ease-out infinite}
.wx-fest .wx::after{left:72%;top:14px;animation-delay:.9s}
@keyframes pop{0%{transform:scale(.2);opacity:0}20%{opacity:1}100%{transform:scale(1.6);opacity:0}}

/* ---------- play: shop / counter ---------- */
.shop{position:relative;flex:none;height:156px;background:linear-gradient(#4A3324,#382519);display:flex;flex-direction:column;justify-content:flex-end}
.seats{display:flex;justify-content:space-around;padding:0 4px;height:122px;position:relative;z-index:1}
.seat{flex:1;max-width:74px;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;cursor:pointer}
.counter{height:30px;flex:none;position:relative;z-index:2;background:
  repeating-linear-gradient(90deg,rgba(0,0,0,.06) 0 2px,transparent 2px 23px,rgba(255,255,255,.04) 23px 25px,transparent 25px 41px),
  linear-gradient(#C98B55,var(--wood) 30%,var(--wood2));box-shadow:0 6px 12px rgba(0,0,0,.45)}
.counter .deco{position:absolute;top:-22px;font-size:22px;display:none}
.counter .radio{left:6px}.counter .flower{right:6px}
.shop.d-radio .radio,.shop.d-flowers .flower{display:block}
.cust{display:flex;flex-direction:column;align-items:center;transition:transform .45s cubic-bezier(.3,1.4,.6,1),opacity .4s}
.cust.enter{transform:translateY(40px);opacity:0}
.cust.exit{transform:translateY(30px);opacity:0;transition-delay:.4s}
.face{font-size:40px;line-height:1.05;filter:drop-shadow(0 3px 2px rgba(0,0,0,.4))}
.bubble{background:var(--paper);color:var(--ink);border-radius:12px;padding:3px 6px;display:flex;gap:1px;font-size:21px;line-height:1.2;position:relative;margin-bottom:6px;min-height:32px;align-items:center;transition:box-shadow .2s}
.bubble::after{content:"";position:absolute;left:50%;bottom:-6px;margin-left:-6px;border:6px solid transparent;border-bottom:0;border-top-color:var(--paper)}
.bubble .think{font-size:16px;letter-spacing:2px;padding:0 4px;color:#7a6a5a}
.bubble .it{position:relative}
.bubble .it.cook{opacity:.45;animation:pulse 1s ease-in-out infinite}
.bubble .it.done{opacity:.2}
.bubble .it.out::after{content:"";position:absolute;left:-2px;right:-2px;top:50%;height:2.5px;background:var(--chili);transform:rotate(-30deg);border-radius:2px}
.cust.need .bubble{box-shadow:0 0 0 2.5px var(--amber),0 0 14px rgba(255,181,71,.7);animation:nudge 1.4s ease-in-out infinite}
@keyframes nudge{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes pulse{50%{opacity:.85}}
.pat{width:42px;height:5px;border-radius:3px;background:rgba(0,0,0,.45);margin-top:2px;overflow:hidden;margin-bottom:3px}
.pat i{display:block;height:100%;width:100%;background:var(--matcha);transition:background .3s}

/* ---------- play: kitchen ---------- */
.kitchen{flex:1;position:relative;min-height:0;background:
  linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px) 0 0/28px 28px,
  linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px) 0 0/28px 28px,
  linear-gradient(#2B2833,#221F29);display:flex;flex-wrap:wrap;justify-content:center;align-content:center;gap:var(--gy,30px) var(--gx,18px);padding:12px 12px 26px}
.station{width:var(--ss,108px);height:var(--ss,108px);position:relative;border-radius:50%;cursor:pointer}
.station .ring{position:absolute;inset:0;border-radius:50%;background:conic-gradient(var(--rc,#FFB547) calc(var(--p,0)*1turn),rgba(255,255,255,.07) 0)}
.station .pot{position:absolute;inset:7px;border-radius:50%;background:radial-gradient(circle at 50% 42%,#46404d,#1c1921 72%);display:flex;align-items:center;justify-content:center;font-size:calc(var(--ss,108px)*.42);box-shadow:inset 0 -6px 10px rgba(0,0,0,.55);transition:box-shadow .2s}
.station .lab{position:absolute;bottom:-21px;left:-10px;right:-10px;text-align:center;font-size:12px;opacity:.75;white-space:nowrap}
.station.cook .pot::before,.station.cook .pot::after{content:"";position:absolute;top:2px;left:36%;width:7px;height:24px;border-radius:8px;background:rgba(255,255,255,.3);filter:blur(3px);animation:steam 1.8s ease-out infinite}
.station.cook .pot::after{left:58%;animation-delay:.9s}
.station.ready .pot{box-shadow:0 0 0 3px var(--matcha),0 0 22px var(--matcha);animation:bob .6s ease-in-out infinite}
.station.ready .lab{color:var(--matcha);opacity:1;font-weight:700}
.station.late .pot{box-shadow:0 0 0 3px var(--chili),0 0 18px var(--chili);animation:shake .25s linear infinite}
.station.late .lab{color:var(--chili);opacity:1;font-weight:700}
.station.burnt .pot span{filter:grayscale(1) brightness(.4)}
.station.burnt .lab{color:#bbb}
.station.nudge{animation:shake .25s linear 2}
@keyframes bob{50%{transform:scale(1.05)}}
@keyframes shake{25%{transform:translateX(-2px)}75%{transform:translateX(2px)}}
.tut{position:absolute;left:14px;right:14px;top:8px;background:rgba(255,244,220,.95);color:var(--ink);border-radius:12px;padding:8px 12px;font-size:13px;line-height:1.55;z-index:4;pointer-events:none}
.tut b{color:#B5462F}

/* ---------- play: bottom ---------- */
.bottombar{display:flex;align-items:center;gap:8px;padding:8px 10px;background:#141B33;flex:none}
.stock{flex:1;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.stock::-webkit-scrollbar{display:none}
.chip{display:flex;align-items:center;gap:3px;background:rgba(255,255,255,.08);border-radius:10px;padding:4px 8px;font-size:13px;white-space:nowrap}
.chip.low{color:var(--amber)}
.chip.zero{color:#ff9a9d;background:rgba(229,72,77,.22)}
.iconbtn{width:42px;height:42px;border-radius:12px;background:rgba(255,255,255,.1);font-size:18px;flex:none}

/* ---------- fx ---------- */
#fx{position:absolute;inset:0;pointer-events:none;z-index:50;overflow:hidden}
.float{position:absolute;font-family:var(--display);font-size:22px;color:var(--amber);text-shadow:0 2px 0 rgba(0,0,0,.55);white-space:nowrap;transform:translate(-50%,0);animation:floatUp 1.15s ease-out forwards}
.float.good{color:var(--matcha)}.float.bad{color:#ff8a8d}
@keyframes floatUp{0%{opacity:0;transform:translate(-50%,6px) scale(.8)}15%{opacity:1;transform:translate(-50%,-4px) scale(1.1)}100%{opacity:0;transform:translate(-50%,-46px) scale(1)}}
.toast{position:absolute;left:50%;top:calc(54px + env(safe-area-inset-top));transform:translateX(-50%);background:rgba(16,20,36,.94);border:1px solid rgba(255,244,220,.15);padding:8px 16px;border-radius:20px;font-size:14px;white-space:nowrap;opacity:0;transition:opacity .2s;z-index:60;pointer-events:none}
.toast.on{opacity:1}

/* ---------- prep / summary (paper) ---------- */
.prep-head{padding:14px 16px 10px;display:flex;align-items:flex-end;gap:10px}
.prep-head .big{font-family:var(--display);font-size:30px;color:var(--amber);line-height:1}
.prep-head .sub{font-size:13px;opacity:.7;margin-top:4px}
.prep-head .right{margin-left:auto;text-align:right}
.prep-head .right .m{font-family:var(--display);font-size:24px}
.prep-head .right .r{font-size:13px;color:var(--amber)}
.evcard{margin:0 12px 10px;display:flex;gap:12px;align-items:center;background:rgba(255,255,255,.07);border-radius:14px;padding:10px 12px}
.evcard .ic{font-size:30px}
.evcard .nm{font-weight:700;font-size:15px}
.evcard .ds{font-size:12px;opacity:.75;margin-top:2px}
.goalbar{margin:0 12px 10px;font-size:13px;background:rgba(255,181,71,.14);border-radius:12px;padding:8px 12px;line-height:1.45}
.goalbar b{color:var(--amber);font-weight:600}
.tabs{display:flex;gap:4px;padding:0 12px;flex:none}
.tab{flex:1;padding:10px 0 9px;border-radius:12px 12px 0 0;background:rgba(255,255,255,.07);font-size:15px}
.tab.on{background:var(--paper);color:var(--ink);font-weight:700}
.panel{flex:1;min-height:0;overflow-y:auto;background:var(--paper);color:var(--ink);margin:0 12px;border-radius:0 0 16px 16px;padding:4px 12px 12px;-webkit-overflow-scrolling:touch}
.sec{font-family:var(--display);font-size:17px;margin:14px 2px 2px;color:#8A4B2A}
.row{display:flex;align-items:center;gap:10px;padding:11px 2px;border-bottom:1px dashed rgba(42,31,23,.2)}
.row:last-child{border-bottom:0}
.row .ic{font-size:30px;width:40px;text-align:center;flex:none}
.row .info{flex:1;min-width:0}
.row .nm{font-weight:700;font-size:15px}
.row .ds{font-size:12px;opacity:.68;margin-top:2px;line-height:1.4}
.row .btns{display:flex;gap:6px;flex:none}
.row.locked .ic{filter:grayscale(1);opacity:.5}
.row.done .nm{text-decoration:line-through;opacity:.5}
.row.cur{background:rgba(255,181,71,.18);border-radius:10px;padding-left:8px;padding-right:8px}
.buy{background:var(--ink);color:var(--paper);border-radius:10px;padding:8px 10px;font-size:13px;min-width:58px;line-height:1.2}
.buy:active{transform:scale(.95)}
.buy:disabled{opacity:.25}
.buy.alt{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
.pill{font-size:12px;padding:5px 9px;border-radius:9px;background:rgba(124,194,107,.25);color:#3d6b30;font-weight:600;white-space:nowrap}
.restock{width:100%;margin:10px 0 2px;background:#8A4B2A;color:var(--paper);border-radius:12px;padding:11px;font-size:14px;font-weight:600}
.restock:disabled{opacity:.35}
.cta-bar{padding:12px 12px 14px;flex:none}

#summary{background:radial-gradient(ellipse at 50% 0,rgba(255,181,71,.18),transparent 60%),var(--night)}
.receipt{margin:16px 18px 0;flex:1;min-height:0;overflow-y:auto;background:var(--paper);color:var(--ink);border-radius:6px 6px 0 0;padding:18px 18px 24px;position:relative;-webkit-mask:radial-gradient(circle 7px at 50% 100%,transparent 98%,#000) 0 0/18px 100% repeat-x}
.receipt h2{font-family:var(--display);font-weight:400;font-size:26px;text-align:center}
.receipt .when{text-align:center;font-size:12px;opacity:.6;margin:2px 0 12px}
.ln{display:flex;justify-content:space-between;padding:5px 0;font-size:15px;font-variant-numeric:tabular-nums}
.ln.minus span:last-child{color:#B5462F}
.ln.total{font-size:19px;font-weight:800;border-top:2px dashed rgba(42,31,23,.4);margin-top:6px;padding-top:10px}
.hr{border-top:1px dashed rgba(42,31,23,.3);margin:8px 0}
.reward{margin-top:12px;background:rgba(255,181,71,.25);border-radius:10px;padding:8px 10px;font-size:14px}
.reward + .reward{margin-top:6px}

/* ---------- modal ---------- */
.modal{position:absolute;inset:0;background:rgba(8,10,20,.72);display:none;align-items:center;justify-content:center;z-index:80;padding:24px}
.modal.on{display:flex}
.card{width:100%;max-width:340px;background:var(--paper);color:var(--ink);border-radius:20px;padding:22px 20px 20px;text-align:center}
.card h3{font-family:var(--display);font-weight:400;font-size:28px;margin-bottom:6px}
.card p{font-size:14px;line-height:1.6;opacity:.8;margin-bottom:16px}
.card .em{font-size:60px;line-height:1;margin-bottom:8px}
.card .btn.quiet{color:var(--ink);border-color:rgba(42,31,23,.3)}

@media (max-height:640px){
  .street{height:92px}.noren span{height:48px;font-size:22px;padding-top:5px;width:36px}.street .lantern{top:52px}
  
}
@media (prefers-reduced-motion:reduce){

<script>
(()=>{
'use strict';
/* ================= DATA ================= */
const DISHES=[
  {id:'ramen',  name:'酱油拉面', icon:'🍜',time:6,  price:38, cost:9,  unlock:0,    w:3, hot:1},
  {id:'beer',   name:'生啤',     icon:'🍺',time:0,  price:18, cost:5,  unlock:200,  w:2, side:1},
  {id:'gyoza',  name:'煎饺',     icon:'🥟',time:4,  price:24, cost:6,  unlock:450,  w:2, side:1, hot:1},
  {id:'oden',   name:'关东煮',   icon:'🍢',time:3.5,price:20, cost:5,  unlock:700,  w:2, side:1, hot:1},
  {id:'rice',   name:'叉烧饭',   icon:'🍚',time:7,  price:46, cost:12, unlock:1200, w:2},
  {id:'tempura',name:'天妇罗',   icon:'🍤',time:5,  price:42, cost:11, unlock:2000, w:2},
  {id:'crab',   name:'帝王蟹拉面',icon:'🦀',time:9, price:108,cost:32, unlock:4500, w:1, hot:1},
];
const CUSTS=[
  {id:'office', name:'上班族',   faces:['👨‍💼','👩‍💼'],      pat:24,tip:1,  w:5},
  {id:'student',name:'学生',     faces:['🧑‍🎓','👦','👧'],    pat:18,tip:.5, w:4, cheap:1},
  {id:'uncle',  name:'大叔',     faces:['👴','🧔'],          pat:32,tip:1.2,w:3, beer:1},
  {id:'worker', name:'夜班工人', faces:['👷','🧑‍🔧','👩‍🔧'], pat:22,tip:1,  w:3, big:1},
  {id:'drunk',  name:'醉客',     faces:['🥴'],              pat:15,tip:1.8,w:0, beer:1},
  {id:'critic', name:'美食评论家',faces:['🕵️'],             pat:22,tip:2,  w:0, critic:1},
  {id:'cat',    name:'招财猫',   faces:['🐱'],              pat:26,tip:3,  w:0, cat:1},
];
const UPS=[
  {id:'stations',icon:'🔥',name:'加一个灶台',desc:l=>`同时做 ${2+l} 份，升级后 ${3+l} 份`,costs:[400,1100,2600]},
  {id:'seats',   icon:'🪑',name:'加一个座位',desc:l=>`吧台 ${3+l} 座，升级后 ${4+l} 座`,costs:[300,800,1800]},
  {id:'fire',    icon:'♨️',name:'猛火灶',    desc:l=>`烹饪时间 ${[100,85,72,60][l]}%，升级后 ${[85,72,60][l]}%`,costs:[350,1000,2400]},
  {id:'warm',    icon:'⏲️',name:'保温技巧',  desc:l=>`完美出餐窗口更宽，更不容易糊`,costs:[250,700,1600]},
  {id:'helper',  icon:'🧑‍🍳',name:'雇伙计',  desc:l=>l===0?'自动把做好的菜端给客人，日薪 ¥60':'熟练伙计：出餐更快，能抓住完美时机，日薪 ¥120',costs:[1500,3200]},
];
const DECOR=[
  {id:'lantern',icon:'🏮',name:'红灯笼',     desc:'客人耐心 +15%',cost:500},
  {id:'radio',  icon:'📻',name:'老收音机',   desc:'客人耐心 +10%',cost:650},
  {id:'neon',   icon:'✨',name:'霓虹招牌',   desc:'客流 +20%',cost:900},
  {id:'flowers',icon:'🌸',name:'樱花盆栽',   desc:'口碑上涨 +25%',cost:1200},
  {id:'cat',    icon:'🐈',name:'招财猫摆件', desc:'招财猫更常来，小费 +10%',cost:1600},
];
const EVENTS=[
  {id:'clear', icon:'🌙',name:'晴朗的夜晚',desc:'普通的一天，好好营业。',w:5},
  {id:'rain',  icon:'🌧️',name:'下雨',      desc:'客人少一些，但更有耐心。',spawn:.75,pat:1.3,w:2},
  {id:'fest',  icon:'🎆',name:'夏日祭',    desc:'附近有祭典，客流大增！多备点货。',spawn:1.45,w:1.4},
  {id:'cold',  icon:'❄️',name:'寒潮',      desc:'热食点单翻倍，售价 +10%。',hot:2,price:1.1,w:1.4},
  {id:'inflate',icon:'📈',name:'菜价上涨', desc:'今天进货贵 50%，省着点买。',cost:1.5,w:1.2},
  {id:'critic',icon:'🕵️',name:'评论家要来',desc:'听说今晚有美食评论家来访。伺候好了口碑大涨。',critic:1,w:1,minDay:3},
  {id:'payday',icon:'💴',name:'发薪日',    desc:'大家手头宽裕，小费 +50%。',tip:1.5,w:1.2},
];
const GOALS=[
  {name:'撑过第一个夜晚',            ok:s=>s.day>=2,                 reward:100},
  {name:'解锁生啤',                  ok:s=>!!s.unlocked.beer,         reward:100},
  {name:'一晚服务 15 位客人',        ok:s=>s.best.served>=15,         reward:200},
  {name:'口碑达到 3 星',             ok:s=>stars(s.rep)>=3,           reward:300},
  {name:'拥有 4 个灶台',             ok:s=>s.up.stations>=2,          reward:400},
  {name:'一晚营业额 ¥2000',          ok:s=>s.best.revenue>=2000,      reward:600},
  {name:'解锁全部菜品',              ok:s=>DISHES.every(d=>s.unlocked[d.id]),reward:1000},
  {name:'口碑 5 星，累计营业额 ¥30000，摘下米其林一星',ok:s=>stars(s.rep)>=5&&s.total>=30000,reward:5000,win:1},
];
const DAY_LEN=110, OPEN_MIN=18*60, SPAN_MIN=8*60, LAST_ORDER=.9;
const SAVE_KEY='ramen-night-v1';

/* ================= STATE ================= */
const newSave=()=>({day:1,money:300,rep:30,stock:{ramen:16},unlocked:{ramen:true},up:{stations:0,seats:0,fire:0,warm:0,helper:0},decor:{},total:0,best:{served:0,revenue:0},goal:0,won:false,lastDemand:{},lastSold:{},event:'clear',spent:0,tut:false});
let S=null,R=null,scene='title',muted=false,curTab='stock',seatEls=[];
const $=id=>document.getElementById(id);
const app=$('app');
function load(){try{const j=localStorage.getItem(SAVE_KEY);if(j){const o=JSON.parse(j),b=newSave();S=Object.assign(b,o);S.up=Object.assign(newSave().up,o.up||{});S.best=Object.assign(newSave().best,o.best||{});return true}}catch(e){}return false}
function save(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(S))}catch(e){}}
try{muted=localStorage.getItem('ramen-muted')==='1'}catch(e){}

/* ================= HELPERS ================= */
const D=id=>DISHES.find(d=>d.id===id);
const CT=id=>CUSTS.find(c=>c.id===id);
const EV=()=>EVENTS.find(e=>e.id===S.event)||EVENTS[0];
const stars=rep=>Math.max(.5,Math.round(rep/10)/2);
const repTxt=r=>'★ '+stars(r).toFixed(1);
const yen=n=>(n<0?'-¥':'¥')+Math.abs(Math.round(n)).toLocaleString('en-US');
const pick=a=>a[Math.floor(Math.random()*a.length)];
function weighted(list,wf){let t=0;const ws=list.map(x=>{const w=Math.max(0,wf(x));t+=w;return w});if(t<=0)return list[0];let r=Math.random()*t;for(let i=0;i<list.length;i++){r-=ws[i];if(r<=0)return list[i]}return list[list.length-1]}
const nStations=()=>2+S.up.stations, nSeats=()=>3+S.up.seats;
const cookMul=()=>[1,.85,.72,.6][S.up.fire];
const perfectWin=()=>1.3+S.up.warm*.45;
const burnAfter=()=>4+S.up.warm*1.6;
const patMul=()=>(1+(S.decor.lantern?.15:0)+(S.decor.radio?.1:0))*(EV().pat||1);
const spawnMul=()=>(1+stars(S.rep)*.12)*(S.decor.neon?1.2:1)*(EV().spawn||1)*(S.day===1?.82:1);
const priceMul=()=>(1+(stars(S.rep)-1)*.06)*(EV().price||1);
const unitCost=d=>Math.round(d.cost*(EV().cost||1));
const helperDelay=()=>[0,2.2,.9][S.up.helper];
const wage=()=>[0,60,120][S.up.helper];
const rent=()=>Math.min(400,30+(S.day-1)*10);
const totalStock=()=>Object.values(S.stock).reduce((a,b)=>a+b,0);
const vibe=ms=>{try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}};

/* ================= AUDIO ================= */
let AC=null;
function tone(f,d,type,v,when=0,f2){const t=AC.currentTime+when,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0008,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.03)}
function sfx(n){if(muted)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();
  switch(n){
    case'tap':tone(520,.06,'triangle',.12);break;
    case'ding':tone(1046,.16,'sine',.09);break;
    case'serve':tone(660,.08,'triangle',.12);tone(880,.1,'triangle',.12,.06);break;
    case'perfect':[784,988,1318].forEach((f,i)=>tone(f,.15,'triangle',.12,i*.06));break;
    case'coin':tone(1318,.06,'square',.045);tone(1760,.14,'square',.045,.05);break;
    case'angry':tone(220,.32,'sawtooth',.07,0,110);break;
    case'err':tone(180,.12,'square',.05);break;
    case'trash':tone(300,.28,'sawtooth',.05,0,80);break;
    case'buy':tone(880,.07,'triangle',.1);tone(1175,.1,'triangle',.1,.05);break;
    case'bell':[659,523].forEach((f,i)=>tone(f,.35,'sine',.1,i*.18));break;
  }}catch(e){}}

/* ================= FX ================= */
function floatAt(el,text,cls=''){const r=el.getBoundingClientRect(),a=app.getBoundingClientRect(),f=document.createElement('div');f.className='float '+cls;f.textContent=text;f.style.left=(r.left-a.left+r.width/2)+'px';f.style.top=(r.top-a.top-4)+'px';$('fx').appendChild(f);setTimeout(()=>f.remove(),1250)}
let toastT=0;
function toast(msg,ms=1500){const t=$('toast');t.textContent=msg;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),ms)}
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id===id));scene=id}
function modal(html){$('modalCard').innerHTML=html;$('modal').classList.add('on')}
function closeModal(){$('modal').classList.remove('on')}

/* ================= TITLE ================= */
function renderTitle(){
  const has=load();
  const el=$('titleActions');
  if(has&&(S.day>1||S.spent>0)){
    el.innerHTML=`<button class="btn" id="tContinue">继续营业<small>第 ${S.day} 天，${yen(S.money)}</small></button><button class="btn quiet" id="tNew">重新开店</button>`;
    $('tContinue').onclick=()=>{sfx('tap');goPrep()};
    $('tNew').onclick=()=>{modal(`<div class="em">🏚️</div><h3>重新开店？</h3><p>现在的进度会被清空，从第 1 天重新开始。</p><button class="btn" id="mYes">清空并重新开店</button><button class="btn quiet" id="mNo">保留进度</button>`);$('mYes').onclick=()=>{closeModal();S=newSave();save();goPrep()};$('mNo').onclick=closeModal};
  }else{
    el.innerHTML=`<button class="btn" id="tNew">开张营业</button>`;
    $('tNew').onclick=()=>{sfx('tap');S=newSave();save();goPrep()};
  }
}

/* ================= GOALS ================= */
function checkGoals(){
  const got=[];
  while(S.goal<GOALS.length&&GOALS[S.goal].ok(S)){const g=GOALS[S.goal];S.money+=g.reward;got.push(g);S.goal++}
  if(got.length)save();
  return got;
}
function winModal(){
  S.won=true;save();
  modal(`<div class="em">⭐</div><h3>米其林一星！</h3><p>深夜拉面屋上了米其林指南。门口每天都排着长队。<br>你可以继续经营，看看能走多远。</p><button class="btn" id="mOk">继续经营</button>`);
  $('mOk').onclick=closeModal;
}

/* ================= PREP ================= */
function goPrep(){
  show('prep');
  const got=checkGoals();
  renderPrep();
  if(got.length){sfx('bell');toast(`目标达成：${got[got.length-1].name}，奖励 ${yen(got.reduce((a,g)=>a+g.reward,0))}`,2400);if(got.some(g=>g.win)&&!S.won)setTimeout(winModal,500)}
}
function renderPrep(){
  $('pDay').textContent=`第 ${S.day} 天`;
  $('pMoney').textContent=yen(S.money);
  $('pRep').textContent='口碑 '+repTxt(S.rep);
  const e=EV();
  $('pEvent').innerHTML=`<div class="ic">${e.icon}</div><div><div class="nm">今晚：${e.name}</div><div class="ds">${e.desc}</div></div>`;
  const g=GOALS[S.goal];
  $('pGoal').innerHTML=g?`🎯 当前目标：<b>${g.name}</b>，奖励 ${yen(g.reward)}`:`🏆 所有目标都完成了。你就是这条街的传说。`;
  document.querySelectorAll('#pTabs .tab').forEach(t=>t.classList.toggle('on',t.dataset.tab===curTab));
  const P=$('pPanel');
  if(curTab==='stock')P.innerHTML=stockPanel();
  else if(curTab==='menu')P.innerHTML=menuPanel();
  else if(curTab==='shop')P.innerHTML=shopPanel();
  else P.innerHTML=goalsPanel();
  $('openSub').textContent=`今晚房租 ${yen(rent())}`+(wage()?`，伙计工资 ${yen(wage())}`:'');
}
function restockPlan(){
  const plan={};let cost=0;
  DISHES.filter(d=>S.unlocked[d.id]).forEach(d=>{
    const dem=S.lastDemand[d.id]||(d.id==='ramen'?14:4);
    const target=Math.ceil(dem*1.2*(EV().spawn||1))+2;
    const need=Math.max(0,target-(S.stock[d.id]||0));
    if(need>0){plan[d.id]=need;cost+=need*unitCost(d)}
  });
  return{plan,cost};
}
function stockPanel(){
  const {cost}=restockPlan();
  let h=`<button class="restock" data-act="restock" ${cost===0||cost>S.money?'disabled':''}>${cost===0?'库存充足':`按昨晚点单量补货，共 ${yen(cost)}`}</button>`;
  DISHES.filter(d=>S.unlocked[d.id]).forEach(d=>{
    const st=S.stock[d.id]||0,c=unitCost(d),dem=S.lastDemand[d.id];
    h+=`<div class="row"><div class="ic">${d.icon}</div><div class="info"><div class="nm">${d.name}　<span class="num">×${st}</span></div><div class="ds">进价 ${yen(c)}，售价 ${yen(d.price)}${dem!=null?`，昨晚点了 ${dem} 份`:''}</div></div>
    <div class="btns"><button class="buy alt" data-act="buy" data-id="${d.id}" data-n="1" ${S.money<c?'disabled':''}>+1</button><button class="buy" data-act="buy" data-id="${d.id}" data-n="5" ${S.money<c*5?'disabled':''}>+5<br><span class="num">${yen(c*5)}</span></button></div></div>`;
  });
  if(S.day<=2)h+=`<div class="row"><div class="ic" style="font-size:22px">💡</div><div class="info"><div class="ds" style="opacity:.8;font-size:13px">食材卖完就做不了这道菜。先营业赚钱，再到“菜单”解锁新菜、到“店铺”加灶台和座位。</div></div></div>`;
  return h;
}
function menuPanel(){
  let h='';
  DISHES.forEach(d=>{
    const u=S.unlocked[d.id];
    const meta=d.time?`售价 ${yen(d.price)}，烹饪 ${d.time} 秒`:`售价 ${yen(d.price)}，即点即上`;
    h+=`<div class="row ${u?'':'locked'}"><div class="ic">${d.icon}</div><div class="info"><div class="nm">${d.name}</div><div class="ds">${meta}${u?'':'<br>解锁送 5 份食材'}</div></div>
    <div class="btns">${u?'<span class="pill">已上架</span>':`<button class="buy" data-act="unlock" data-id="${d.id}" ${S.money<d.unlock?'disabled':''}>解锁<br><span class="num">${yen(d.unlock)}</span></button>`}</div></div>`;
  });
  return h;
}
function shopPanel(){
  let h='<div class="sec">设备与人手</div>';
  UPS.forEach(u=>{
    const l=S.up[u.id],max=l>=u.costs.length,c=u.costs[l];
    h+=`<div class="row"><div class="ic">${u.icon}</div><div class="info"><div class="nm">${u.name}${l?`<span style="opacity:.55;font-weight:400"> Lv.${l}</span>`:''}</div><div class="ds">${max?'已经满级':u.desc(l)}</div></div>
    <div class="btns">${max?'<span class="pill">满级</span>':`<button class="buy" data-act="up" data-id="${u.id}" ${S.money<c?'disabled':''}>${yen(c)}</button>`}</div></div>`;
  });
  h+='<div class="sec">装饰</div>';
  DECOR.forEach(d=>{
    const own=S.decor[d.id];
    h+=`<div class="row"><div class="ic">${d.icon}</div><div class="info"><div class="nm">${d.name}</div><div class="ds">${d.desc}</div></div>
    <div class="btns">${own?'<span class="pill">已摆上</span>':`<button class="buy" data-act="decor" data-id="${d.id}" ${S.money<d.cost?'disabled':''}>${yen(d.cost)}</button>`}</div></div>`;
  });
  return h;
}
function goalsPanel(){
  return GOALS.map((g,i)=>{
    const done=i<S.goal,cur=i===S.goal;
    return `<div class="row ${done?'done':''} ${cur?'cur':''}"><div class="ic" style="font-size:22px">${done?'✅':cur?'🎯':'🔒'}</div><div class="info"><div class="nm">${g.name}</div><div class="ds">奖励 ${yen(g.reward)}</div></div></div>`;
  }).join('');
}
function spend(n){if(S.money<n){sfx('err');toast('钱不够');return false}S.money-=n;sfx('buy');vibe(6);return true}
$('pPanel').addEventListener('click',ev=>{
  const b=ev.target.closest('button');if(!b||b.disabled)return;
  const act=b.dataset.act,id=b.dataset.id;
  if(act==='buy'){const d=D(id),n=+b.dataset.n,c=unitCost(d)*n;if(!spend(c))return;S.stock[id]=(S.stock[id]||0)+n;S.spent+=c}
  else if(act==='restock'){const {plan,cost}=restockPlan();if(!spend(cost))return;for(const k in plan)S.stock[k]=(S.stock[k]||0)+plan[k];S.spent+=cost;toast('补好货了')}
  else if(act==='unlock'){const d=D(id);if(!spend(d.unlock))return;S.unlocked[id]=true;S.stock[id]=(S.stock[id]||0)+5;toast(`${d.icon} ${d.name} 上架了`)}
  else if(act==='up'){const u=UPS.find(x=>x.id===id),c=u.costs[S.up[id]];if(!spend(c))return;S.up[id]++;toast(`${u.icon} ${u.name}，完成`)}
  else if(act==='decor'){const d=DECOR.find(x=>x.id===id);if(!spend(d.cost))return;S.decor[id]=true;toast(`${d.icon} ${d.name} 摆上了`)}
  const got=checkGoals();
  if(got.length){sfx('bell');toast(`目标达成：${got[got.length-1].name}，奖励 ${yen(got.reduce((a,g)=>a+g.reward,0))}`,2400);if(got.some(g=>g.win)&&!S.won)setTimeout(winModal,500)}
  save();
  const top=$('pPanel').scrollTop;renderPrep();$('pPanel').scrollTop=top;
});
$('pTabs').addEventListener('click',ev=>{const t=ev.target.closest('.tab');if(!t)return;curTab=t.dataset.tab;sfx('tap');$('pPanel').scrollTop=0;renderPrep()});
$('openBtn').onclick=()=>{
  if(totalStock()===0){sfx('err');toast('没有食材了，先进货');curTab='stock';renderPrep();return}
  startDay();
};

/* ================= PLAY ================= */
function startDay(){
  R={t:0,customers:[],stations:[],spawnT:1.2,nextId:1,paused:false,lastOrderSaid:false,repStart:S.rep,
     criticAt:EV().critic?DAY_LEN*(.25+Math.random()*.35):-1,
     stats:{served:0,angry:0,revenue:0,tips:0,perfect:0,burnt:0,sold:{},demand:{}}};
  // decor classes
  const st=$('street');st.className='street';
  ['lantern','neon','cat'].forEach(k=>S.decor[k]&&st.classList.add('d-'+k));
  const ev=EV();if(ev.id==='rain')st.classList.add('wx-rain');if(ev.id==='cold')st.classList.add('wx-cold');if(ev.id==='fest')st.classList.add('wx-fest');
  $('evBadge').textContent=ev.icon+' '+ev.name;
  const sh=$('shopEl');sh.className='shop';['radio','flowers'].forEach(k=>S.decor[k]&&sh.classList.add('d-'+k));
    $('hDay').textContent=`第${S.day}天`;
  // seats
  const seats=$('seats');seats.innerHTML='';seatEls=[];
  for(let i=0;i<nSeats();i++){const s=document.createElement('div');s.className='seat';s.addEventListener('pointerdown',e=>{e.preventDefault();const c=R.customers.find(c=>c.seat===i&&c.state!=='leave');if(c)tapCustomer(c)});seats.appendChild(s);seatEls.push(s)}
  // stations
  const k=$('kitchen');k.innerHTML='';
  for(let i=0;i<nStations();i++){
    const el=document.createElement('div');el.className='station';
    el.innerHTML='<div class="ring"></div><div class="pot"><span></span></div><div class="lab">空闲</div>';
    const stn={el,ring:el.querySelector('.ring'),dishEl:el.querySelector('.pot span'),labEl:el.querySelector('.lab'),state:'idle',dish:null,cust:null,item:null,t:0,cookTime:1,rt:0,_cls:'',_lab:'',_dish:''};
    el.addEventListener('pointerdown',e=>{e.preventDefault();tapStation(stn)});
    k.appendChild(el);R.stations.push(stn);
  }
  if(!S.tut){const t=document.createElement('div');t.className='tut';t.id='tut';t.innerHTML='① <b>点客人</b>接单，菜会下锅<br>② 锅<b>亮绿光</b>时点锅出餐，越快越容易拿到“完美”<br>③ 客人头顶绿条耗尽就会生气走掉';k.appendChild(t)}
  renderStock();
  show('play');
  sizeKitchen();
  sfx('bell');
  toast(`${ev.icon} 开门营业！`);
}
function sizeKitchen(){
  const k=$('kitchen');if(!R)return;const n=R.stations.length;
  const w=k.clientWidth-24,hgt=k.clientHeight-38;
  const cols=n<=2?2:n===4?2:3,rows=Math.ceil(n/cols);
  const gx=16,lab=30;
  const s=Math.max(64,Math.min(116,(w-(cols-1)*gx)/cols,(hgt-rows*lab)/rows));
  const gy=Math.max(lab,Math.min(lab+30,(hgt-rows*s)/rows));
  k.style.setProperty('--ss',Math.floor(s)+'px');k.style.setProperty('--gy',Math.floor(gy)+'px');
  k.style.setProperty('--gx',(cols===2?Math.max(gx,Math.min(40,w-2*s)):gx)+'px');
}
window.addEventListener('resize',()=>{if(scene==='play')sizeKitchen()});
const clockMin=()=>OPEN_MIN+Math.min(1,R.t/DAY_LEN)*SPAN_MIN;
function clockTxt(){const m=Math.floor(clockMin()),h=Math.floor(m/60)%24,mm=m%60;return String(h).padStart(2,'0')+':'+String(Math.floor(mm/10)*10).padStart(2,'0')}

function nextInterval(){
  const m=clockMin();
  const peak=(m>=19*60&&m<21*60)?1.35:(m>=23*60&&m<24.5*60)?1.2:1;
  return 6.2/(spawnMul()*peak)*(.6+Math.random()*.8);
}
function spawn(){
  const free=[];for(let i=0;i<seatEls.length;i++)if(!R.customers.some(c=>c.seat===i))free.push(i);
  if(!free.length)return false;
  const seat=pick(free),m=clockMin();
  let type;
  if(R.criticAt>0&&R.t>=R.criticAt){type=CT('critic');R.criticAt=-1}
  else if(S.day>=3&&Math.random()<.015)type=CT('critic');
  else if(Math.random()<(S.decor.cat?.045:.012))type=CT('cat');
  else type=weighted(CUSTS,c=>c.id==='drunk'?(m>=23*60?4:0):c.w);
  const items=makeOrder(type);
  const maxPat=type.pat*patMul()*(items.length>1?1.3:1);
  const c={id:R.nextId++,type,face:pick(type.faces),seat,state:'arrive',timer:.5,items:items.map(d=>({dish:d,st:'wait'})),maxPat,pat:maxPat,perfect:0};
  items.forEach(d=>R.stats.demand[d]=(R.stats.demand[d]||0)+1);
  R.customers.push(c);
  const el=document.createElement('div');el.className='cust enter';
  el.innerHTML='<div class="bubble"><span class="think">…</span></div><div class="face"></div><div class="pat"><i></i></div>';
  el.querySelector('.face').textContent=c.face;
  seatEls[seat].appendChild(el);
  c.el=el;c.bub=el.querySelector('.bubble');c.faceEl=el.querySelector('.face');c.patEl=el.querySelector('.pat i');
  requestAnimationFrame(()=>requestAnimationFrame(()=>el.classList.remove('enter')));
  if(type.critic)toast('🕵️ 美食评论家进门了！');
  else if(type.cat)toast('🐱 招财猫来了！');
  return true;
}
function makeOrder(type){
  const avail=DISHES.filter(d=>S.unlocked[d.id]),ev=EV();
  const wf=d=>d.w*(ev.hot&&d.hot?2:1)*(type.cheap&&d.price>40?.25:1)*(type.cat&&d.id==='crab'?5:1);
  const beerOk=!!S.unlocked.beer;
  const first=(type.beer&&beerOk&&Math.random()<.45)?D('beer'):weighted(avail,wf);
  const items=[first.id];
  const p=.12+Math.min(.35,S.day*.03)+(type.big?.3:0)+(type.beer?.25:0);
  if(avail.length>1&&Math.random()<p){
    const rest=avail.filter(d=>d.id!==first.id);
    const second=(type.beer&&beerOk&&first.id!=='beer')?D('beer'):weighted(rest,d=>wf(d)*(d.side?1.6:1));
    items.push(second.id);
  }
  return items;
}
function renderBubble(c){
  if(c.state!=='wait')return;
  c.bub.innerHTML=c.items.map(it=>{const out=it.st==='wait'&&!(S.stock[it.dish]>0);return `<span class="it ${it.st} ${out?'out':''}">${D(it.dish).icon}</span>`}).join('');
}
function renderAllBubbles(){R.customers.forEach(renderBubble)}
function renderStock(){
  $('stockBar').innerHTML=DISHES.filter(d=>S.unlocked[d.id]).map(d=>{const n=S.stock[d.id]||0;return `<span class="chip ${n===0?'zero':n<=3?'low':''}">${d.icon}<span class="num">${n}</span></span>`}).join('');
}

function tapCustomer(c){
  if(!R||R.paused)return;
  if(c.state!=='wait'){return}
  const pending=c.items.filter(i=>i.st==='wait');
  if(!pending.length){toast('已经在做了，盯着锅');return}
  let did=false,msg='';
  for(const it of pending){
    const d=D(it.dish);
    if(!(S.stock[d.id]>0)){msg=`${d.icon} ${d.name}卖完了`;continue}
    if(d.time===0){S.stock[d.id]--;did=true;floatAt(c.el,d.icon,'good');serveItem(c,it,false);continue}
    const st=R.stations.find(s=>s.state==='idle');
    if(!st){msg='灶台都满了';break}
    S.stock[d.id]--;it.st='cook';
    Object.assign(st,{state:'cook',dish:d.id,cust:c,item:it,t:0,cookTime:d.time*cookMul(),rt:0});
    did=true;
  }
  if(did){sfx('tap');vibe(8)}
  if(msg){if(!did)sfx('err');toast(msg)}
  renderAllBubbles();renderStock();
}
function serveItem(c,it,perfect){
  it.st='done';
  R.stats.sold[it.dish]=(R.stats.sold[it.dish]||0)+1;
  if(perfect){c.perfect++;R.stats.perfect++;floatAt(c.el,'完美！','good')}
  c.pat=Math.min(c.maxPat,c.pat+c.maxPat*.2);
  if(c.items.every(i=>i.st==='done')){c.state='eat';c.timer=1.3;c.bub.innerHTML='<span>😋</span>';c.el.classList.remove('need')}
  else renderBubble(c);
  if(!S.tut){S.tut=true;const t=$('tut');if(t)t.remove()}
}
function clearStation(st){Object.assign(st,{state:'idle',dish:null,cust:null,item:null,t:0,rt:0})}
function tapStation(st){
  if(!R||R.paused)return;
  if(st.state==='idle'){toast('先点上面的客人接单');return}
  if(st.state==='cook'){st.el.classList.remove('nudge');void st.el.offsetWidth;st.el.classList.add('nudge');return}
  if(st.state==='burnt'){R.stats.burnt++;sfx('trash');toast('糊了，倒掉。再点客人重做');reopen(st);clearStation(st);return}
  deliver(st,st.rt<=perfectWin(),false);
}
function reopen(st){ // burnt dish: put customer's item back to waiting
  const c=st.cust,it=st.item;
  if(c&&it&&c.state==='wait'&&it.st==='cook'){it.st='wait';renderBubble(c)}
}
function deliver(st,perfect,auto){
  let c=st.cust,it=st.item;
  if(!c||c.state!=='wait'||!it||it.st!=='cook'){
    c=R.customers.find(x=>x.state==='wait'&&x.items.some(i=>i.st==='wait'&&i.dish===st.dish));
    it=c&&c.items.find(i=>i.st==='wait'&&i.dish===st.dish);
  }
  if(!c){if(auto)return;toast('没人要这份了，倒掉');sfx('trash');clearStation(st);return}
  sfx(perfect?'perfect':'serve');vibe(12);
  floatAt(st.el,D(st.dish).icon);
  serveItem(c,it,perfect);clearStation(st);
}
function pay(c,quiet){
  const base=c.items.reduce((s,i)=>s+D(i.dish).price,0)*priceMul();
  const pf=Math.max(0,c.pat/c.maxPat);
  let tipRate=c.type.tip*(.08+.22*pf)+.12*(c.perfect/c.items.length);
  tipRate*=(EV().tip||1)*(S.decor.cat?1.1:1);
  const tip=base*tipRate,total=Math.round(base+tip);
  S.money+=total;R.stats.revenue+=total;R.stats.tips+=Math.round(tip);R.stats.served++;
  S.rep=Math.min(100,S.rep+.7*(.5+pf)*(c.type.critic?6:1)*(S.decor.flowers?1.25:1));
  if(!quiet){floatAt(c.el,'+'+yen(total));sfx('coin');
    if(c.type.critic)toast('🕵️ 评论家很满意，口碑大涨！');else if(c.type.cat)toast(`🐱 招财猫留下了 ${yen(total)}！`)}
  leave(c);
}
function leave(c){c.state='leave';c.timer=.9;c.el.classList.remove('need');c.el.classList.add('exit')}
function angry(c){
  c.faceEl.textContent='😠';c.bub.innerHTML='<span>💢</span>';
  R.stats.angry++;S.rep=Math.max(0,S.rep-(c.type.critic?10:2.5));
  sfx('angry');vibe([20,40,20]);floatAt(c.el,'走了…','bad');
  if(c.type.critic)toast('🕵️ 评论家等不及走了，口碑大跌');
  leave(c);
}

/* ================= LOOP ================= */
function step(dt){
  if(scene!=='play'||!R)return;
  R.t+=dt;
  if(R.t<DAY_LEN*LAST_ORDER){R.spawnT-=dt;if(R.spawnT<=0)R.spawnT=spawn()?nextInterval():.6}
  else if(!R.lastOrderSaid){R.lastOrderSaid=true;toast('🔔 最后点单，不再进新客人')}
  for(let i=R.customers.length-1;i>=0;i--){
    const c=R.customers[i];
    if(c.state==='arrive'){if((c.timer-=dt)<=0){c.state='think';c.timer=.8}}
    else if(c.state==='think'){if((c.timer-=dt)<=0){c.state='wait';renderBubble(c)}}
    else if(c.state==='wait'){c.pat-=dt;if(c.pat<=0)angry(c)}
    else if(c.state==='eat'){if((c.timer-=dt)<=0)pay(c)}
    else if(c.state==='leave'){if((c.timer-=dt)<=0){c.el.remove();R.customers.splice(i,1)}}
  }
  const pw=perfectWin(),ba=burnAfter(),hd=helperDelay();
  for(const st of R.stations){
    if(st.state==='cook'){st.t+=dt;if(st.t>=st.cookTime){st.state='ready';st.rt=0;sfx('ding')}}
    else if(st.state==='ready'){st.rt+=dt;
      if(hd&&st.rt>=hd)deliver(st,st.rt<=pw,true);
      if(st.state==='ready'&&st.rt>=ba){st.state='burnt';sfx('trash');floatAt(st.el,'糊了','bad');reopen(st)}}
  }
  if(R.t>=DAY_LEN){endDay();return}
  render();
}
function render(){
  $('hClock').textContent=clockTxt();
  $('hBar').style.width=(Math.min(1,R.t/DAY_LEN)*100)+'%';
  $('hMoney').textContent=yen(S.money);
  $('hRep').textContent=repTxt(S.rep);
  for(const c of R.customers){
    if(c.state!=='wait')continue;
    const f=Math.max(0,c.pat/c.maxPat);
    c.patEl.style.width=(f*100)+'%';
    c.patEl.style.background=f>.5?'var(--matcha)':f>.25?'var(--amber)':'var(--chili)';
    c.el.classList.toggle('need',c.items.some(i=>i.st==='wait'&&S.stock[i.dish]>0));
  }
  const pw=perfectWin(),ba=burnAfter();
  for(const st of R.stations){
    let p=0,rc='#FFB547',cls='',lab='空闲',dish='';
    if(st.state==='cook'){p=st.t/st.cookTime;cls='cook';lab=`还要 ${Math.ceil(st.cookTime-st.t)} 秒`;dish=D(st.dish).icon}
    else if(st.state==='ready'){dish=D(st.dish).icon;if(st.rt<=pw){p=1;rc='#7CC26B';cls='ready';lab='好了！点我'}else{p=1-(st.rt-pw)/(ba-pw);rc='#E5484D';cls='late';lab='快糊了！'}}
    else if(st.state==='burnt'){p=0;cls='burnt';lab='糊了，点击倒掉';dish=D(st.dish).icon}
    st.ring.style.setProperty('--p',p.toFixed(3));st.ring.style.setProperty('--rc',rc);
    if(cls!==st._cls){st.el.className='station '+cls;st._cls=cls}
    if(lab!==st._lab){st.labEl.textContent=lab;st._lab=lab}
    if(dish!==st._dish){st.dishEl.textContent=dish;st._dish=dish}
  }
}
let last=0;
function loop(ts){
  requestAnimationFrame(loop);
  const dt=Math.min(.05,(ts-last)/1000||0);last=ts;
  if(scene==='play'&&R&&!R.paused)step(dt);
}
requestAnimationFrame(loop);

/* ================= PAUSE ================= */
function pause(){
  if(!R||scene!=='play')return;R.paused=true;
  modal(`<div class="em">⏸</div><h3>暂停中</h3><p>第 ${S.day} 天，${clockTxt()}</p><button class="btn" id="mResume">继续营业</button><button class="btn quiet" id="mSound">${muted?'打开音效':'关闭音效'}</button><button class="btn quiet" id="mQuit">回到标题</button><p style="margin:10px 0 0;font-size:12px">回到标题会放弃今晚的营业，进度停在今天开店前。</p>`);
  $('mResume').onclick=()=>{closeModal();R.paused=false};
  $('mSound').onclick=()=>{muted=!muted;try{localStorage.setItem('ramen-muted',muted?'1':'0')}catch(e){}$('mSound').textContent=muted?'打开音效':'关闭音效';sfx('tap')};
  $('mQuit').onclick=()=>{closeModal();
    // rollback: reload last save (state at prep)
    load();R=null;show('title');renderTitle()};
}
$('pauseBtn').onclick=pause;
document.addEventListener('visibilitychange',()=>{if(document.hidden&&scene==='play'&&R&&!R.paused)pause()});

/* ================= END OF DAY ================= */
function endDay(){
  for(const c of R.customers)if(c.state==='eat')pay(c,true);
  const s=R.stats,r=rent(),w=wage(),spent=S.spent;
  S.money-=r+w;
  const net=s.revenue-spent-r-w;
  S.total+=s.revenue;
  S.best.served=Math.max(S.best.served,s.served);
  S.best.revenue=Math.max(S.best.revenue,s.revenue);
  S.lastDemand=s.demand;S.lastSold=s.sold;
  const repD=S.rep-R.repStart,dayNo=S.day;
  S.day++;S.spent=0;
  const pool=EVENTS.filter(e=>!e.minDay||S.day>=e.minDay);
  S.event=weighted(pool,e=>e.w).id;
  save();
  const broke=S.money<0&&totalStock()===0;
  $('receipt').innerHTML=`<h2>第 ${dayNo} 天 收摊</h2><div class="when">18:00 – 02:00</div>
    <div class="ln"><span>招待客人</span><span>${s.served} 位</span></div>
    <div class="ln"><span>气走客人</span><span>${s.angry} 位</span></div>
    <div class="ln"><span>完美出餐</span><span>${s.perfect} 次</span></div>
    ${s.burnt?`<div class="ln"><span>糊锅</span><span>${s.burnt} 次</span></div>`:''}
    <div class="hr"></div>
    <div class="ln"><span>营业额</span><span>${yen(s.revenue)}</span></div>
    <div class="ln" style="font-size:13px;opacity:.65"><span>　其中小费</span><span>${yen(s.tips)}</span></div>
    <div class="ln minus"><span>进货</span><span>-${yen(spent)}</span></div>
    <div class="ln minus"><span>房租</span><span>-${yen(r)}</span></div>
    ${w?`<div class="ln minus"><span>伙计工资</span><span>-${yen(w)}</span></div>`:''}
    <div class="ln total"><span>今晚净赚</span><span>${yen(net)}</span></div>
    <div class="ln"><span>口碑</span><span>${repTxt(S.rep)}（${repD>=0?'+':''}${(repD/20).toFixed(2)}）</span></div>
    <div class="ln"><span>手头现金</span><span>${yen(S.money)}</span></div>`;
  const btn=$('sumBtn');
  if(broke){btn.textContent='重新开店';btn.onclick=()=>{S=newSave();save();goPrep()};
    $('receipt').innerHTML+=`<div class="reward" style="background:rgba(229,72,77,.18)">钱花光了，也没有食材了。小店只能关门。</div>`}
  else{btn.textContent='准备明天';btn.onclick=()=>{sfx('tap');curTab='stock';goPrep()}}
  R.customers.forEach(c=>c.el.remove());
  $('fx').innerHTML='';$('toast').classList.remove('on');
  show('summary');sfx('bell');
}

/* ================= BOOT ================= */
$('modal').addEventListener('click',e=>{if(e.target.id==='modal'&&scene!=='play')closeModal()});
document.addEventListener('gesturestart',e=>e.preventDefault());
renderTitle();
window.__game={get S(){return S},get R(){return R},step,spawn,tapCustomer,tapStation,startDay,goPrep,endDay};
})();
</script>
