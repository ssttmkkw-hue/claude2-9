<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#211A3A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>夜市摊王</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">

  <!-- 标题 -->
  <section id="title" class="screen on">
    <div class="t-lights"></div>
    <div class="t-main">
      <div class="t-neon">夜市摊王</div>
      <p class="t-sub">一条夜市街，四个摊位<br>你和三家老摊主，抢同一群顾客</p>
      <div class="t-stalls" id="tStalls"></div>
    </div>
    <div class="t-actions" id="tActions"></div>
  </section>

  <!-- 出摊准备 / 摊位设计 -->
  <section id="prep" class="screen">
    <div class="p-head">
      <div><div class="p-night" id="pNight">第 1 晚</div><div class="p-sub" id="pSub">周一</div></div>
      <div class="p-right"><div class="p-money num" id="pMoney">¥1,000</div><div class="p-rep" id="pRep">口碑 ★3.0</div></div>
    </div>
    <div class="p-stage" id="pStage">
      <div class="p-stall" id="pStall"></div>
      <div class="p-hint">点摊位可修改</div>
    </div>
    <div class="tabs" id="pTabs">
      <button class="tab on" data-tab="menu">菜品</button>
      <button class="tab" data-tab="stock">备货</button>
      <button class="tab" data-tab="look">外观</button>
      <button class="tab" data-tab="shop">商店</button>
      <button class="tab" data-tab="rivals">对手</button>
    </div>
    <div class="panel" id="pPanel"></div>
    <div class="cta"><button class="btn" id="goBtn">出摊！<small id="goSub"></small></button></div>
  </section>

  <!-- 夜市运营 -->
  <section id="market" class="screen">
    <div class="m-hud">
      <div class="m-night" id="mNight">第1晚</div>
      <div class="m-clock"><b class="num" id="mClock">18:00</b><div class="bar"><i id="mBar"></i></div></div>
      <button class="iconbtn" id="pauseBtn" aria-label="暂停">⏸</button>
    </div>
    <div class="m-board" id="mBoard"></div>
    <div class="m-stage" id="mStage">
      <div class="m-row top"><div class="m-slot" data-pos="0"></div><div class="m-slot" data-pos="1"></div></div>
      <div class="m-street" id="mStreet"><div class="m-banner" id="mBanner"></div></div>
      <div class="m-row bottom"><div class="m-slot" data-pos="2"></div><div class="m-slot" data-pos="3"></div></div>
      <div class="m-people" id="mPeople"></div>
    </div>
    <div class="m-cards" id="mCards"></div>
  </section>

  <!-- 收摊结算 -->
  <section id="result" class="screen">
    <div class="r-scroll" id="rScroll"></div>
    <div class="cta"><button class="btn" id="rBtn">下一晚</button></div>
  </section>

  <!-- 底部弹出编辑 -->
  <div class="sheet-mask" id="sheetMask"></div>
  <div class="sheet" id="sheet"></div>

  <div class="modal" id="modal"><div class="card" id="modalCard"></div></div>
  <div id="fx"></div>
  <div class="toast" id="toast"></div>
</div>
<script src="js/data.js"></script>
<script src="js/ai.js"></script>
<script src="js/game.js"></script>
</body>
</html>
